<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주성 & 다핀 모바일 청첩장 선택</title>
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #fafbfc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      color: #2c3e50;
      padding: 40px 0;
    }
    h1 { margin-bottom: 40px; font-weight: 300; }
    .container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 90%;
      max-width: 400px;
    }
    .version-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-decoration: none;
      color: inherit;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      transition: all 0.3s ease;
      border: 1px solid #e8eaed;
    }
    .version-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
      border-color: #8b9dc3;
    }
    .version-card h2 { margin: 0 0 5px 0; font-size: 18px; color: #2c3e50; }
    .version-card p { margin: 0; font-size: 13px; color: #7f8c8d; }
    
    /* 버전별 포인트 컬러 */
    .v1 { border-left: 5px solid #2c3e50; }
    .v2 { border-left: 5px solid #d4a373; }
    .v3 { border-left: 5px solid #000000; }
    .v4 { border-left: 5px solid #8b4513; }
    .v5 { border-left: 5px solid #ffd700; background: #1a1a1a; color: white; }
    .v5 h2 { color: white; }
    .v5 p { color: #aaa; }

    .footer { margin-top: 50px; font-size: 12px; color: #bdc3c7; }
  </style>
</head>
<body>
  <h1>Template Selection</h1>
  <div class="container">
    <a href="./v1/" class="version-card v1">
      <h2>Version 1</h2>
      <p>Elegant & Classic (Navy)</p>
    </a>
    <a href="./v2/" class="version-card v2">
      <h2>Version 2</h2>
      <p>Romantic & Warm (Rose Gold)</p>
    </a>
    <a href="./v3/" class="version-card v3">
      <h2>Version 3</h2>
      <p>Modern & Chic (Magazine)</p>
    </a>
    <a href="./v4/" class="version-card v4">
      <h2>Version 4</h2>
      <p>Traditional Grace (Oriental)</p>
    </a>
    <a href="./v5/" class="version-card v5">
      <h2>Version 5</h2>
      <p>Dark Luxury (Starry Night)</p>
    </a>
  </div>
  <div class="footer">© 2026 Juseong & Dapin</div>
</body>
</html>
